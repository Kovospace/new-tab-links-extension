<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- globe outline -->
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#777" stroke-width="1.25"/>
  <!-- vertical ellipse -->
  <ellipse cx="16" cy="16" rx="4.5" ry="10.5" fill="none" stroke="#777" stroke-width="1.25"/>
  <!-- horizontal equator -->
  <line x1="5.5" y1="16" x2="26.5" y2="16" stroke="#777" stroke-width="1.25"/>
  <!-- top latitude hint -->
  <path d="M9 10.5 Q16 8.5 23 10.5" fill="none" stroke="#777" stroke-width="1.25"/>
  <!-- bottom latitude hint -->
  <path d="M9 21.5 Q16 23.5 23 21.5" fill="none" stroke="#777" stroke-width="1.25"/>
</svg>
