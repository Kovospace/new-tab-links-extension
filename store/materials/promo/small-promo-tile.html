<!doctype html>
<!--
  Source of small-promo-tile.png (440x280). Re-render with:
  google-chrome --headless --hide-scrollbars --window-size=440,280 \
    --screenshot=small-promo-tile-raw.png small-promo-tile.html
  then strip the alpha channel (the store wants 24-bit PNG).

  The wordmark is drawn in the website's colours: black, and the amber accent with dark
  text on it (--color-accent, --color-accent-text, --color-text-muted),
  from new-tab-links-frontend/src/design-tokens.scss. No blue anywhere.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --color-text: #fff;
    --color-accent: #e0a100;
    --color-accent-text: #111;
    --font-family: Arial, Helvetica, sans-serif;
  }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: var(--font-family);
    color: var(--color-text);
    background: radial-gradient(ellipse at 50% 55%, #262626 0%, #000 75%);
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 0 0 30px;
    box-sizing: border-box;
  }
  .logo { width: 132px; height: 132px; flex: none; }
  .text { display: flex; flex-direction: column; gap: 18px; }

  /* the wordmark, in the website's accent */
  .title {
    font-weight: bold;
    font-size: 48px;
    position: relative;
    align-self: flex-start;
  }
  .title em {
    font-style: normal;
    color: var(--color-accent-text);
    background-color: var(--color-accent);
    padding: 0 0.125em;
    border-top-left-radius: 0.25em;
    border-top-right-radius: 0.25em;
    margin-right: 0.0625em;
  }
  .title::after {
    content: '';
    display: block;
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 0.125em;
    background-color: var(--color-accent);
  }

  .tagline { font-size: 24px; line-height: 1.25; color: #bbb; }
</style>
</head>
<body>
  <img class="logo" src="../../../public/icons/logo-512.png" alt="">
  <div class="text">
    <div class="title"><em>Tabi</em>links</div>
    <div class="tagline">Your bookmarks,<br>grouped,<br>on every new tab</div>
  </div>
</body>
</html>
